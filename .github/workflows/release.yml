name: Release

# Pushing a tag like v1.2.0 builds every platform and publishes a GitHub release.
# Tags with a suffix (v1.2.0-rc.1) are published as pre-releases, which the installer
# and the "latest" download links ignore.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Windows and Linux are cross-compiled on Windows, which also bundles the official
  # yt-dlp.exe into the Windows zip.
  build-windows-linux:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download the official yt-dlp for the Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools/yt-dlp.exe
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS -OutFile tools/SHA2-256SUMS

      - name: Test and build archives
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Version $version -Platforms "windows,linux"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: archives-windows-linux
          path: dist/
          if-no-files-found: error

  # The macOS menu-bar icon needs cgo, so the Mac archives are built on a Mac.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test and build archives
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package.ps1 -Version $version -Platforms darwin -SkipTests

      - name: Check both builds have the menu-bar icon
        run: |
          for archive in dist/*.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP" ./ytgrab
            otool -L "$RUNNER_TEMP/ytgrab" | grep -q AppKit || { echo "$archive was built without the menu-bar icon"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: archives-macos
          path: dist/
          if-no-files-found: error

  release:
    needs: [build-windows-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true

      - name: Write release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v') -replace '-.*$', ''
          $sections = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## '
          $section = $sections | Where-Object { $_ -match "^\[$([regex]::Escape($version))\]" } | Select-Object -First 1
          if ($section) {
            $notes = ($section -split "`n", 2)[1].Trim() -replace '(?ms)^\[\d+\.\d+\.\d+\]: .*$', ''
          } else {
            $notes = "See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          }
          $notes += "`n`n**Install:** on macOS and Linux run ``curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh``, or ``brew install sanoy24/tap/ytgrab``. On Windows, ``scoop install sanoy24/ytgrab`` (after ``scoop bucket add sanoy24 https://github.com/Sanoy24/scoop-bucket``), or download the zip below, extract it, and double-click **Start YTGrab.cmd**. Each file has a matching ``.sha256`` checksum."
          Set-Content -Path release-notes.md -Value $notes.Trim() -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $ghArgs = @('release', 'create', $tag, '--verify-tag', '--title', "YTGrab $version", '--notes-file', 'release-notes.md')
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh @ghArgs

  # Updates the Homebrew tap and Scoop bucket after a stable release. Needs a
  # PACKAGES_TOKEN secret: a fine-grained token with "Contents: read and write" on
  # Sanoy24/homebrew-tap and Sanoy24/scoop-bucket. Without it the job is skipped.
  packages:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.PACKAGES_TOKEN != ''

      - name: Update the Homebrew formula and Scoop manifest
        if: env.PACKAGES_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh scripts/render-packages.sh "$version" rendered
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() { # repo, file
            git clone -q "https://x-access-token:${PACKAGES_TOKEN}@github.com/Sanoy24/$1.git" "$1"
            cp "rendered/$2" "$1/$2"
            cd "$1"
            git add "$2"
            if git diff --cached --quiet; then echo "$1 already has $version"; else
              git commit -qm "Update YTGrab to $version" && git push -q
            fi
            cd ..
          }
          publish homebrew-tap Formula/ytgrab.rb
          publish scoop-bucket bucket/ytgrab.json

