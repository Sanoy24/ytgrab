name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w on the files above."; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build the Mac archive with the menu-bar icon and start it
        if: runner.os == 'macOS'
        run: |
          pwsh -File scripts/package.ps1 -Version 0.0.0-ci -Platforms darwin -SkipTests -OutDir dist-ci
          tar -xzf dist-ci/ytgrab-0.0.0-ci-darwin-arm64.tar.gz -C "$RUNNER_TEMP" ./ytgrab
          otool -L "$RUNNER_TEMP/ytgrab" | grep AppKit
          sh .github/scripts/smoke.sh "$RUNNER_TEMP/ytgrab"
      - name: Installer adds YTGrab.app
        if: runner.os == 'macOS'
        run: |
          YTGRAB_NO_SETUP=1 sh install.sh
          plutil -lint ~/Applications/YTGrab.app/Contents/Info.plist
          test -x ~/Applications/YTGrab.app/Contents/MacOS/YTGrab
          cat ~/Applications/YTGrab.app/Contents/MacOS/YTGrab
      - name: Linux tray and autostart on a private D-Bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends dbus desktop-file-utils
          dbus-run-session -- go test -count=1 -v -run 'TestLinuxTray|TestLinuxEntry' ./internal/tray ./internal/autostart

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Keep the trace of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh install.sh scripts/render-packages.sh
      - name: Run the installer and check its menu entry
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          YTGRAB_NO_SETUP=1 sh install.sh
          desktop-file-validate ~/.local/share/applications/ytgrab.desktop
          cat ~/.local/share/applications/ytgrab.desktop
          ~/.local/bin/ytgrab --version
