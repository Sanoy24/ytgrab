name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w on the files above."; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Linux tray and autostart on a private D-Bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends dbus desktop-file-utils
          dbus-run-session -- go test -count=1 -v -run 'TestLinuxTray|TestLinuxEntry' ./internal/tray ./internal/autostart

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Keep the trace of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh scripts/render-packages.sh
      - name: Run the installer and check its menu entry
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          YTGRAB_NO_SETUP=1 sh install.sh
          desktop-file-validate ~/.local/share/applications/ytgrab.desktop
          cat ~/.local/share/applications/ytgrab.desktop
          ~/.local/bin/ytgrab --version
