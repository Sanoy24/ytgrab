name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas for how it could work
